<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单文字拆分</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Tahoma,
        "PingFang SC", "Microsoft Yahei", Arial, sans-serif;
      font-size: 14px;
      color: #1f2329;
      background: #fff;
      padding: 16px;
      line-height: 1.5;
    }
    body.dark { background: #252525; color: #e0e0e0; }

    h2 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
    .sub { font-size: 12px; color: #8f959e; margin-bottom: 12px; }
    body.dark .sub { color: #9e9e9e; }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid #dee0e3;
      border-radius: 10px;
      margin-bottom: 12px;
      background: #fafbfc;
    }
    body.dark .status {
      background: #2b2b2b;
      border-color: #434343;
    }
    .status .left { min-width: 0; }
    .status .title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .status .desc { font-size: 12px; color: #646a73; word-break: break-all; }
    body.dark .status .desc { color: #a3a3a3; }
    .pill {
      font-size: 11px;
      border-radius: 999px;
      padding: 4px 8px;
      white-space: nowrap;
      border: 1px solid transparent;
      flex: 0 0 auto;
    }
    .pill.ok { background: #e8f5e9; color: #2e7d32; }
    .pill.warn { background: #fff8e1; color: #f57f17; }
    .pill.err { background: #fff0f0; color: #d32f2f; }
    body.dark .pill.ok { background: #1b2e1b; color: #a5d6a7; }
    body.dark .pill.warn { background: #2f2410; color: #f8cf6a; }
    body.dark .pill.err { background: #3b1c1c; color: #ef9a9a; }

    label { display: block; font-size: 12px; color: #8f959e; margin-bottom: 6px; }
    body.dark label { color: #9e9e9e; }

    textarea {
      width: 100%;
      min-height: 96px;
      padding: 10px 12px;
      border: 1px solid #dee0e3;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
      background: #fff;
      color: #1f2329;
      font-family: inherit;
      outline: none;
    }
    textarea:focus { border-color: #1456f0; }
    body.dark textarea {
      background: #333;
      border-color: #434343;
      color: #e0e0e0;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #dee0e3;
      font-size: 13px;
      cursor: pointer;
      background: #fff;
      color: #1f2329;
      font-family: inherit;
      transition: background 0.15s, opacity 0.15s;
    }
    button:hover { background: #f2f3f5; }
    button.primary {
      background: #1456f0;
      color: #fff;
      border-color: transparent;
    }
    button.primary:hover { background: #0e48d0; }
    button.primary:disabled {
      background: #a0b4f7;
      cursor: not-allowed;
      opacity: 0.9;
    }
    button.ghost {
      margin-left: auto;
      color: #8f959e;
      border-color: transparent;
      background: transparent;
    }
    body.dark button {
      background: #333;
      border-color: #434343;
      color: #e0e0e0;
    }
    body.dark button:hover { background: #3a3a3a; }
    body.dark button.primary { background: #4571e1; color: #fff; }
    body.dark button.primary:disabled { background: #2c3e6e; }

    .msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      line-height: 1.6;
      word-break: break-all;
    }
    .msg.error { background: #fff0f0; color: #d32f2f; display: block; }
    .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.info { background: #eef4ff; color: #1456f0; display: block; }
    body.dark .msg.error { background: #3b1c1c; color: #ef9a9a; }
    body.dark .msg.success { background: #1b2e1b; color: #a5d6a7; }
    body.dark .msg.info { background: #1f2b44; color: #9fc0ff; }

    .card {
      border: 1px solid #dee0e3;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 14px;
      background: #fff;
    }
    body.dark .card {
      border-color: #434343;
      background: #252525;
    }
    .card-header {
      padding: 10px 14px;
      background: #f2f3f5;
      font-size: 12px;
      font-weight: 600;
      color: #646a73;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dee0e3;
    }
    body.dark .card-header {
      background: #2e2e2e;
      color: #9e9e9e;
      border-color: #434343;
    }

    .placeholder {
      padding: 26px 16px;
      text-align: center;
      color: #8f959e;
      font-size: 13px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .field {
      padding: 10px 14px;
      border-bottom: 1px solid #dee0e3;
      border-right: 1px solid #dee0e3;
      min-height: 68px;
    }
    body.dark .field { border-color: #3a3a3a; }
    .field.full { grid-column: 1 / -1; border-right: none; }
    .field:nth-child(even):not(.full) { border-right: none; }
    .field:last-child,
    .field:nth-last-child(2):not(.full) { border-bottom: none; }

    .field-label {
      font-size: 10px;
      color: #8f959e;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .field-value {
      font-size: 13px;
      font-weight: 500;
      color: #1f2329;
      word-break: break-all;
      white-space: pre-wrap;
    }
    body.dark .field-value { color: #e0e0e0; }
    .field-value.empty { color: #c9cdd4; font-weight: 400; font-style: italic; }
    .field-value.muted { color: #8f959e; font-weight: 400; }

    .debug-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: #f7f8fa;
      border-radius: 10px;
      font-size: 11px;
      color: #646a73;
      word-break: break-all;
      line-height: 1.7;
      display: none;
      max-height: 260px;
      overflow-y: auto;
      border: 1px dashed #dee0e3;
    }
    body.dark .debug-box {
      background: #2a2a2a;
      color: #9e9e9e;
      border-color: #3a3a3a;
    }
    .divider { height: 1px; background: #dee0e3; margin: 12px 0; }
    body.dark .divider { background: #3a3a3a; }

    @media (max-width: 520px) {
      .fields { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .field:nth-child(even):not(.full) { border-right: 1px solid #dee0e3; }
      .field:last-child, .field:nth-last-child(2):not(.full) { border-bottom: 1px solid #dee0e3; }
      body.dark .field:nth-child(even):not(.full) { border-right: 1px solid #3a3a3a; }
      .ghost { margin-left: 0; }
    }
  </style>
</head>
<body>
  <h2>📦 订单文字拆分</h2>
  <div class="sub">先预览拆分结果，确认无误后写入当前飞书多维表格中的“个人表”。</div>

  <div class="status">
    <div class="left">
      <div class="title">SDK 状态</div>
      <div class="desc" id="sdkDesc">正在初始化…</div>
    </div>
    <div class="pill warn" id="sdkPill">等待中</div>
  </div>

  <label>粘贴订单文字（支持中英文逗号）</label>
  <textarea id="input" placeholder="例：陈文永，18825732781-2867，广东省 东莞市 虎门镇北栅东方大厦怡泰沐足2楼前台，12100103000078 风轮1个 商用件 福州发 顺丰陆运到付 微信单"></textarea>

  <div class="btn-row">
    <button onclick="doParse()">拆分预览</button>
    <button class="primary" id="confirmBtn" onclick="doConfirm()" disabled>✓ 写入当前表</button>
    <button class="ghost" onclick="doReset()">清空</button>
  </div>

  <div class="msg" id="msgBox"></div>

  <div class="card">
    <div class="card-header">
      <span>拆分预览</span>
      <span id="badge" class="pill warn" style="display:none">待识别</span>
    </div>
    <div class="placeholder" id="placeholder">请在上方输入文字后点击「拆分预览」</div>
    <div class="fields" id="fields" style="display:none">
      <div class="field"><div class="field-label">收货姓名</div><div class="field-value" id="f-name"></div></div>
      <div class="field"><div class="field-label">收货电话</div><div class="field-value" id="f-phone"></div></div>
      <div class="field full"><div class="field-label">地址</div><div class="field-value" id="f-addr"></div></div>
      <div class="field full"><div class="field-label">商品编码</div><div class="field-value" id="f-code"></div></div>
      <div class="field"><div class="field-label">商品类型</div><div class="field-value" id="f-type"></div></div>
      <div class="field"><div class="field-label">物品数量</div><div class="field-value" id="f-qty"></div></div>
      <div class="field"><div class="field-label">申请渠道</div><div class="field-value" id="f-channel"></div></div>
      <div class="field"><div class="field-label">家商用</div><div class="field-value" id="f-house"></div></div>
      <div class="field"><div class="field-label">微信单</div><div class="field-value" id="f-wechat"></div></div>
      <div class="field"><div class="field-label">填表人</div><div class="field-value" id="f-user"></div></div>
      <div class="field full"><div class="field-label">物流备注</div><div class="field-value muted" id="f-logistics"></div></div>
      <div class="field"><div class="field-label">申请日期（年月日）</div><div class="field-value" id="f-date"></div></div>
      <div class="field"><div class="field-label">申请日期（年月日时分秒）</div><div class="field-value" id="f-datetime"></div></div>
    </div>
  </div>

  <div class="debug-box" id="debugBox"></div>

  <script type="module">
    let bitable = null;
    let sdkReady = false;
    let parsed = null;
    let currentTable = null;
    let currentTableName = '';
    let currentUserName = '';
    let fieldMetaMap = {};
    let fieldTypeMap = {};

    const $ = (id) => document.getElementById(id);
    const CHANNEL_OPTIONS = ['河南', '福州', '佛山', '自仓库', '南京'];

    function log(msg) {
      const b = $('debugBox');
      b.style.display = 'block';
      const line = document.createElement('div');
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      b.appendChild(line);
      b.scrollTop = b.scrollHeight;
    }

    function setStatus(kind, desc) {
      const pill = $('sdkPill');
      const descEl = $('sdkDesc');
      pill.className = 'pill ' + kind;
      descEl.textContent = desc;
      if (kind === 'ok') pill.textContent = '已连接';
      else if (kind === 'warn') pill.textContent = '未连接';
      else pill.textContent = '错误';
    }

    function showMsg(type, text) {
      const b = $('msgBox');
      b.className = 'msg ' + type;
      b.textContent = text;
      b.style.display = 'block';
    }

    function hideMsg() {
      const b = $('msgBox');
      b.className = 'msg';
      b.textContent = '';
      b.style.display = 'none';
    }

    function applyTheme(t) {
      document.body.classList.toggle('dark', t === 'DARK');
    }

    async function loadSDK() {
      try {
        const mod = await import('https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk/+esm');
        bitable = mod.bitable || mod.default?.bitable || mod.default || null;
        log('已通过 ESM 模块加载 Base JS SDK');
      } catch (e1) {
        log('ESM 模块加载失败：' + (e1?.message || e1));
        bitable = window.bitable || window?.lark?.bitable || null;
        if (bitable) log('已从全局对象读取到 SDK');
      }

      if (!bitable || !bitable.base) {
        sdkReady = false;
        setStatus('warn', '未检测到飞书 SDK。请确保该页面是从飞书多维表格侧边栏插件中打开，而不是直接在浏览器里打开。');
        showMsg('error', '未检测到飞书 SDK。请在飞书多维表格侧边栏插件里运行此页面。');
        $('confirmBtn').disabled = true;
        return;
      }

      sdkReady = true;
      setStatus('ok', 'SDK 已就绪，正在读取当前表…');

      try {
        const theme = await bitable.bridge.getTheme();
        applyTheme(theme);
        bitable.bridge.onThemeChange((ev) => applyTheme(ev.data.theme));
      } catch (e) {
        log('主题读取失败：' + (e?.message || e));
      }

      await refreshActiveTable();
      await refreshCurrentUser();
    }

    async function refreshActiveTable() {
      try {
        currentTable = await bitable.base.getActiveTable();
        const meta = await currentTable.getMeta();
        currentTableName = meta?.name || '当前表';
        $('sdkDesc').textContent = `已连接到：${currentTableName}（${meta?.id || '未知ID'}）`;

        const metaList = await currentTable.getFieldMetaList();
        fieldMetaMap = {};
        fieldTypeMap = {};
        for (const f of metaList) {
          fieldMetaMap[f.name] = f.id;
          fieldTypeMap[f.name] = f.type;
        }
        log(`当前表：${currentTableName}；字段数：${metaList.length}`);
        log('字段映射：' + JSON.stringify(fieldMetaMap));
        $('confirmBtn').disabled = false;
      } catch (e) {
        log('读取当前表失败：' + (e?.message || e));
        setStatus('err', '已检测到 SDK，但无法读取当前表。请确认打开的是多维表格侧边栏插件。');
        showMsg('error', '已检测到 SDK，但无法读取当前表：' + (e?.message || e));
        $('confirmBtn').disabled = true;
      }
    }

    async function refreshCurrentUser() {
      try {
        let userName = '';

        // 1) 尝试任何可能存在的“姓名/昵称”类接口
        const maybeMethods = [
          'getUserInfo',
          'getCurrentUserInfo',
          'getBaseUserInfo',
          'getUserProfile',
        ];

        for (const m of maybeMethods) {
          const fn = bitable?.bridge?.[m];
          if (typeof fn === 'function') {
            try {
              const res = await fn.call(bitable.bridge);
              if (typeof res === 'string' && res.trim()) {
                userName = res.trim();
                break;
              }
              if (res && typeof res === 'object') {
                userName = res.name || res.nickName || res.nickname || res.displayName || res.realName || res.userName || res.fullName || '';
                if (userName) break;
              }
            } catch (_) {}
          }
        }

        // 2) 回退到 Base UserId（官方明确支持，且在侧边栏等点位唯一）
        if (!userName) {
          try {
            userName = await bitable.bridge.getBaseUserId();
          } catch (_) {}
        }

        // 3) 再回退到 UserId
        if (!userName) {
          try {
            userName = await bitable.bridge.getUserId();
          } catch (_) {}
        }

        currentUserName = String(userName || '').trim();
        $('f-user').textContent = currentUserName || '未识别';
        log('当前填表人：' + (currentUserName || '未识别'));
      } catch (e) {
        log('读取当前用户失败：' + (e?.message || e));
      }
    }

    function pad2(n) { return String(n).padStart(2, '0'); }

    function formatDateParts(now) {
      const dateStr = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
      const dateTimeStr = `${dateStr} ${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
      return {
        dateStr,
        dateTimeStr,
        todayMs: new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(),
        nowMs: now.getTime()
      };
    }

    function normalizeText(raw) {
      return String(raw || '')
        .trim()
        .replace(/，/g, ',')
        .replace(/\r\n/g, '\n')
        .replace(/\n+/g, ' ')
        .replace(/\s+/g, ' ');
    }

    function parseOrder(raw) {
      if (!raw || !raw.trim()) return { ok: false, error: '请先输入订单文字' };

      const norm = String(raw).trim().replace(/，/g, ',');
      const parts = norm.split(',').map(s => s.trim()).filter(Boolean);
      if (parts.length < 4) {
        return { ok: false, error: `格式不符：需要至少 4 段逗号分隔内容，当前只有 ${parts.length} 段` };
      }

      const name = parts[0];
      const phone = parts[1];
      const addr = parts[2];
      const rest = parts.slice(3).join(' ').trim();
      const tokens = normalizeText(rest).split(' ').filter(Boolean);

      if (tokens.length < 2) {
        return { ok: false, error: '商品信息段格式不符：至少需要「商品编码 商品类型数量」' };
      }

      const code = tokens[0].trim();
      let idx = 1;

      // 商品类型与数量
      let productRaw = tokens[idx] || '';
      let productType = '';
      let qty = '';

      // 支持：风轮1个 / 支架12个
      let m = productRaw.match(/^(.+?)(\d+(?:\.\d+)?)(?:个)?$/);
      if (m) {
        productType = m[1].trim();
        qty = m[2].trim();
        idx += 1;
      } else if (/^\d+(?:\.\d+)?个?$/.test(tokens[idx + 1] || '')) {
        // 支持：风轮 1个
        productType = productRaw.trim();
        qty = String(tokens[idx + 1]).replace(/个$/, '');
        idx += 2;
      } else {
        productType = productRaw.trim();
        qty = '1'; // 一条文字只会有一个商品，默认 1
        idx += 1;
      }

      const remaining = tokens.slice(idx);
      let channel = '';
      let houseCommercial = '';
      let wechatSingle = '';
      const logisticsTokens = [];

      for (const token of remaining) {
        const t = token.trim();
        if (!t) continue;

        if (t === '微信单') {
          wechatSingle = '微信单';
          continue;
        }

        if (t === '商用件' || t === '商用') {
          houseCommercial = '商用';
          continue;
        }
        if (t === '家用件' || t === '家用') {
          houseCommercial = '家用';
          continue;
        }

        if (!channel && t.endsWith('发')) {
          const candidate = t.slice(0, -1).trim();
          if (candidate) {
            channel = candidate; // 例如：佛山发 -> 佛山
            continue;
          }
        }

        // 已经识别到渠道之后，剩下的都算物流备注
        if (channel) logisticsTokens.push(t);
      }

      const logistics = logisticsTokens.join(' ').trim();

      const missing = [];
      if (!name) missing.push('收货姓名');
      if (!phone) missing.push('收货电话');
      if (!addr) missing.push('地址');
      if (!code) missing.push('商品编码');
      if (!productType) missing.push('商品类型');
      if (!qty) missing.push('物品数量');
      if (!channel) missing.push('申请渠道');

      if (missing.length) return { ok: false, error: '以下字段未能识别：' + missing.join('、') };

      return {
        ok: true,
        data: {
          name,
          phone,
          addr,
          code,
          productType,
          qty,
          channel,
          houseCommercial,
          wechatSingle,
          logistics
        }
      };
    }

    function setField(id, val, muted = false) {
      const el = $(id);
      if (!el) return;
      el.className = 'field-value' + (muted ? ' muted' : '') + (!val ? ' empty' : '');
      el.textContent = val || (muted ? '无' : '未识别');
    }

    function findFieldIdByKeywords(keywords, options = {}) {
      const names = Object.keys(fieldMetaMap);
      const exact = options.exact || [];
      for (const e of exact) {
        if (fieldMetaMap[e]) return fieldMetaMap[e];
      }
      for (const k of keywords) {
        for (const name of names) {
          if (name === k) return fieldMetaMap[name];
        }
      }
      for (const k of keywords) {
        for (const name of names) {
          if (name.includes(k)) return fieldMetaMap[name];
        }
      }
      return '';
    }

    function detectFieldIds() {
      return {
        name: findFieldIdByKeywords(['收货姓名']),
        phone: findFieldIdByKeywords(['收货电话']),
        addr: findFieldIdByKeywords(['地址']),
        code: findFieldIdByKeywords(['商品编码']),
        type: findFieldIdByKeywords(['商品类型']),
        qty: findFieldIdByKeywords(['物品数量']),
        channel: findFieldIdByKeywords(['申请渠道']),
        logistics: findFieldIdByKeywords(['物流备注']),
        house: findFieldIdByKeywords(['家商用']),
        wechat: findFieldIdByKeywords(['微信单']),
        user: findFieldIdByKeywords(['填表人']),
        date: findFieldIdByKeywords(['年月日'], { exact: ['申请日期（年月日）', '申请日期td（年月日）', '申请日期（年月日） '] }),
        datetime: findFieldIdByKeywords(['时分秒'], { exact: ['申请日期（年月日时分秒）'] })
      };
    }

    function optionValue(fieldType, text) {
      if (fieldType === 3) return { text }; // 单选
      if (fieldType === 4) return [{ text }]; // 多选
      return text;
    }

    function setPreviewValues(data) {
      const now = new Date();
      const { dateStr, dateTimeStr } = formatDateParts(now);

      setField('f-name', data.name);
      setField('f-phone', data.phone);
      setField('f-addr', data.addr);
      setField('f-code', data.code);
      setField('f-type', data.productType);
      setField('f-qty', data.qty);
      setField('f-channel', data.channel);
      setField('f-house', data.houseCommercial || '');
      setField('f-wechat', data.wechatSingle || '');
      setField('f-user', currentUserName || '未识别');
      setField('f-logistics', data.logistics, true);
      setField('f-date', dateStr);
      setField('f-datetime', dateTimeStr);
    }

    function doParse() {
      hideMsg();
      const raw = $('input').value;
      const result = parseOrder(raw);
      if (!result.ok) {
        parsed = null;
        $('confirmBtn').disabled = true;
        showMsg('error', result.error);
        $('placeholder').style.display = 'block';
        $('fields').style.display = 'none';
        $('badge').style.display = 'none';
        return;
      }

      parsed = result.data;
      setPreviewValues(parsed);

      $('placeholder').style.display = 'none';
      $('fields').style.display = 'grid';

      const badge = $('badge');
      badge.style.display = 'inline-flex';
      badge.className = 'pill ok';
      badge.textContent = '识别正常';

      $('confirmBtn').disabled = !sdkReady;
    }

    async function doConfirm() {
      hideMsg();

      if (!parsed) {
        showMsg('error', '请先点击「拆分预览」确认文本格式。');
        return;
      }
      if (!sdkReady || !bitable || !currentTable) {
        showMsg('error', '未连接到飞书 SDK，请在飞书多维表格侧边栏插件里打开此页面。');
        return;
      }

      const now = new Date();
      const { todayMs, nowMs } = formatDateParts(now);
      const ids = detectFieldIds();

      try {
        $('confirmBtn').disabled = true;
        $('confirmBtn').textContent = '写入中…';

        const fieldMetaList = await currentTable.getFieldMetaList();
        const tableFieldTypeMap = {};
        for (const f of fieldMetaList) tableFieldTypeMap[f.name] = f.type;

        const fields = {};
        const add = (fieldId, value) => {
          if (!fieldId) return;
          fields[fieldId] = value;
        };

        // 基础字段
        add(ids.name, parsed.name);
        add(ids.phone, parsed.phone);
        add(ids.addr, parsed.addr);
        add(ids.code, parsed.code);
        add(ids.type, parsed.productType);
        if (ids.qty) fields[ids.qty] = Number(parsed.qty) || 0;
        if (ids.logistics) add(ids.logistics, parsed.logistics);

        // 申请渠道：单选
        if (ids.channel) {
          const fieldName = Object.keys(fieldMetaMap).find(n => fieldMetaMap[n] === ids.channel) || '';
          const fType = tableFieldTypeMap[fieldName];
          fields[ids.channel] = optionValue(fType, parsed.channel);
        }

        // 家商用：单选
        if (ids.house && parsed.houseCommercial) {
          const fieldName = Object.keys(fieldMetaMap).find(n => fieldMetaMap[n] === ids.house) || '';
          const fType = tableFieldTypeMap[fieldName];
          fields[ids.house] = optionValue(fType, parsed.houseCommercial);
        }

        // 微信单：单选
        if (ids.wechat && parsed.wechatSingle) {
          const fieldName = Object.keys(fieldMetaMap).find(n => fieldMetaMap[n] === ids.wechat) || '';
          const fType = tableFieldTypeMap[fieldName];
          fields[ids.wechat] = optionValue(fType, parsed.wechatSingle);
        }

        // 填表人：优先写入当前账号显示名；取不到则写入 BaseUserId
        if (ids.user) {
          fields[ids.user] = currentUserName || '';
        }

        // 日期字段：一个填当天日期，一个填当前时分秒
        if (ids.date) fields[ids.date] = todayMs;
        if (ids.datetime) fields[ids.datetime] = nowMs;

        log('最终写入 fields：' + JSON.stringify(fields));

        const recordId = await currentTable.addRecord({ fields });
        showMsg('success', `已写入「${currentTableName}」，recordId：${recordId}`);
        log('写入成功，recordId=' + recordId);

        doReset(false);
      } catch (e) {
        log('写入失败：' + (e?.message || e));
        showMsg('error', '写入失败：' + (e?.message || e));
      } finally {
        $('confirmBtn').textContent = '✓ 写入当前表';
        $('confirmBtn').disabled = !sdkReady;
      }
    }

    function doReset(clearInput = true) {
      hideMsg();
      parsed = null;
      $('badge').style.display = 'none';
      $('placeholder').style.display = 'block';
      $('fields').style.display = 'none';
      $('confirmBtn').disabled = !sdkReady;
      if (clearInput) $('input').value = '';
      const ids = ['f-name','f-phone','f-addr','f-code','f-type','f-qty','f-channel','f-house','f-wechat','f-user','f-logistics','f-date','f-datetime'];
      for (const id of ids) $(id).textContent = '';
    }

    window.doParse = doParse;
    window.doConfirm = doConfirm;
    window.doReset = doReset;

    (async function main() {
      log('开始初始化…');
      try {
        await loadSDK();
      } catch (e) {
        log('初始化异常：' + (e?.message || e));
        setStatus('err', '初始化失败。');
        showMsg('error', '初始化失败：' + (e?.message || e));
      }
    })();
  </script>
</body>
</html>

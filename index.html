<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单文字拆分</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Tahoma,
        "PingFang SC", "Microsoft Yahei", Arial, sans-serif;
      font-size: 14px;
      color: #1f2329;
      background: #fff;
      padding: 16px;
      line-height: 1.5;
    }
    body.dark { background: #252525; color: #e0e0e0; }

    h2 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
    .sub { font-size: 12px; color: #8f959e; margin-bottom: 12px; }
    body.dark .sub { color: #9e9e9e; }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid #dee0e3;
      border-radius: 10px;
      margin-bottom: 12px;
      background: #fafbfc;
    }
    body.dark .status {
      background: #2b2b2b;
      border-color: #434343;
    }
    .status .left { min-width: 0; }
    .status .title { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .status .desc { font-size: 12px; color: #646a73; word-break: break-all; }
    body.dark .status .desc { color: #a3a3a3; }
    .pill {
      font-size: 11px;
      border-radius: 999px;
      padding: 4px 8px;
      white-space: nowrap;
      border: 1px solid transparent;
      flex: 0 0 auto;
    }
    .pill.ok { background: #e8f5e9; color: #2e7d32; }
    .pill.warn { background: #fff8e1; color: #f57f17; }
    .pill.err { background: #fff0f0; color: #d32f2f; }
    body.dark .pill.ok { background: #1b2e1b; color: #a5d6a7; }
    body.dark .pill.warn { background: #2f2410; color: #f8cf6a; }
    body.dark .pill.err { background: #3b1c1c; color: #ef9a9a; }

    label { display: block; font-size: 12px; color: #8f959e; margin-bottom: 6px; }
    body.dark label { color: #9e9e9e; }

    textarea {
      width: 100%;
      min-height: 96px;
      padding: 10px 12px;
      border: 1px solid #dee0e3;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
      background: #fff;
      color: #1f2329;
      font-family: inherit;
      outline: none;
    }
    textarea:focus { border-color: #1456f0; }
    body.dark textarea {
      background: #333;
      border-color: #434343;
      color: #e0e0e0;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #dee0e3;
      font-size: 13px;
      cursor: pointer;
      background: #fff;
      color: #1f2329;
      font-family: inherit;
      transition: background 0.15s, opacity 0.15s;
    }
    button:hover { background: #f2f3f5; }
    button.primary {
      background: #1456f0;
      color: #fff;
      border-color: transparent;
    }
    button.primary:hover { background: #0e48d0; }
    button.primary:disabled {
      background: #a0b4f7;
      cursor: not-allowed;
      opacity: 0.9;
    }
    button.ghost {
      margin-left: auto;
      color: #8f959e;
      border-color: transparent;
      background: transparent;
    }
    body.dark button {
      background: #333;
      border-color: #434343;
      color: #e0e0e0;
    }
    body.dark button:hover { background: #3a3a3a; }
    body.dark button.primary { background: #4571e1; color: #fff; }
    body.dark button.primary:disabled { background: #2c3e6e; }

    .msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      line-height: 1.6;
      word-break: break-all;
    }
    .msg.error { background: #fff0f0; color: #d32f2f; display: block; }
    .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.info { background: #eef4ff; color: #1456f0; display: block; }
    body.dark .msg.error { background: #3b1c1c; color: #ef9a9a; }
    body.dark .msg.success { background: #1b2e1b; color: #a5d6a7; }
    body.dark .msg.info { background: #1f2b44; color: #9fc0ff; }

    .card {
      border: 1px solid #dee0e3;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 14px;
      background: #fff;
    }
    body.dark .card {
      border-color: #434343;
      background: #252525;
    }
    .card-header {
      padding: 10px 14px;
      background: #f2f3f5;
      font-size: 12px;
      font-weight: 600;
      color: #646a73;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #dee0e3;
    }
    body.dark .card-header {
      background: #2e2e2e;
      color: #9e9e9e;
      border-color: #434343;
    }

    .placeholder {
      padding: 18px 14px;
      text-align: center;
      color: #8f959e;
      font-size: 13px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .field {
      padding: 6px 10px;
      border-bottom: 1px solid #dee0e3;
      border-right: 1px solid #dee0e3;
      min-height: 44px;
    }
    body.dark .field { border-color: #3a3a3a; }
    .field.full { grid-column: 1 / -1; border-right: none; }
    .field:nth-child(even):not(.full) { border-right: none; }
    .fields .field:nth-last-child(-n+2):not(.full) { border-bottom: none; }
    .fields .field.full:last-child { border-bottom: none; }

    .field-label {
      font-size: 10px;
      color: #8f959e;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }
    .field-value {
      font-size: 12px;
      font-weight: 500;
      color: #1f2329;
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    body.dark .field-value { color: #e0e0e0; }
    .field-value.empty { color: #c9cdd4; font-weight: 400; font-style: italic; }
    .field-value.muted { color: #8f959e; font-weight: 400; }
    .field-value.danger { color: #d32f2f; font-weight: 600; }
    body.dark .field-value.danger { color: #ef9a9a; }

    .stock-row {
      display: none;
      grid-column: 1 / -1;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #dee0e3;
    }
    .stock-row.visible { display: grid; }
    body.dark .stock-row { border-color: #3a3a3a; }
    .stock-row .field:nth-child(even) { border-right: none; }

    .debug-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: #f7f8fa;
      border-radius: 10px;
      font-size: 11px;
      color: #646a73;
      word-break: break-all;
      line-height: 1.7;
      display: none;
      max-height: 260px;
      overflow-y: auto;
      border: 1px dashed #dee0e3;
    }
    body.dark .debug-box {
      background: #2a2a2a;
      color: #9e9e9e;
      border-color: #3a3a3a;
    }
    .divider { height: 1px; background: #dee0e3; margin: 12px 0; }
    body.dark .divider { background: #3a3a3a; }

    @media (max-width: 360px) {
      .ghost { margin-left: 0; }
    }
  </style>
</head>
<body>
  <h2>📦 订单文字拆分</h2>
  <div class="sub">先预览拆分结果，确认无误后写入固定的飞书多维表格“总表”。</div>

  <div class="status">
    <div class="left">
      <div class="title">SDK 状态</div>
      <div class="desc" id="sdkDesc">正在初始化…</div>
    </div>
    <div class="pill warn" id="sdkPill">等待中</div>
  </div>

  <label>粘贴订单文字（支持中英文逗号）</label>
  <textarea id="input" placeholder="例：李洪川，17844719778-5944，四川省眉山市洪雅县，11002015002541 电机1个 佛山基地仓 商用件 福州发 顺丰陆运到付 微信单"></textarea>

  <div class="btn-row">
    <button onclick="doParse()">拆分预览</button>
    <button class="primary" id="confirmBtn" onclick="doConfirm()" disabled>✓ 写入总表</button>
    <button class="ghost" onclick="doReset()">清空</button>
  </div>

  <div class="msg" id="msgBox"></div>

  <div class="card">
    <div class="card-header">
      <span>拆分预览</span>
      <span id="badge" class="pill warn" style="display:none">待识别</span>
    </div>
    <div class="placeholder" id="placeholder">请在上方输入文字后点击「拆分预览」</div>
    <div class="fields" id="fields" style="display:none">
      <div class="stock-row" id="stockRow">
        <div class="field"><div class="field-label">是否有库存</div><div class="field-value" id="f-has-stock"></div></div>
        <div class="field"><div class="field-label">库存数量</div><div class="field-value" id="f-stock-qty"></div></div>
      </div>
      <div class="field"><div class="field-label">收货姓名</div><div class="field-value" id="f-name"></div></div>
      <div class="field"><div class="field-label">收货电话</div><div class="field-value" id="f-phone"></div></div>
      <div class="field full"><div class="field-label">地址</div><div class="field-value" id="f-addr"></div></div>
      <div class="field"><div class="field-label">商品编码</div><div class="field-value" id="f-code"></div></div>
      <div class="field"><div class="field-label">商品类型</div><div class="field-value" id="f-type"></div></div>
      <div class="field"><div class="field-label">物品数量</div><div class="field-value" id="f-qty"></div></div>
      <div class="field"><div class="field-label">申请渠道</div><div class="field-value" id="f-channel"></div></div>
      <div class="field"><div class="field-label">仓库</div><div class="field-value muted" id="f-warehouse"></div></div>
      <div class="field"><div class="field-label">家商用</div><div class="field-value" id="f-house"></div></div>
      <div class="field"><div class="field-label">微信单</div><div class="field-value" id="f-wechat"></div></div>
      <div class="field"><div class="field-label">申请日期（年月日）</div><div class="field-value" id="f-date"></div></div>
      <div class="field"><div class="field-label">申请日期（时分秒）</div><div class="field-value" id="f-datetime"></div></div>
      <div class="field"><div class="field-label">物流备注</div><div class="field-value muted" id="f-logistics"></div></div>
    </div>
  </div>

  <div class="debug-box" id="debugBox"></div>

  <script type="module">
    let bitable = null;
    let sdkReady = false;
    let parsed = null;
    let currentTable = null;
    let currentTableName = '';
    let inventoryTable = null;
    let inventoryTableName = '';
    let inventoryCodeFieldId = '';
    let inventoryQtyFieldId = '';
    let inboundTable = null;
    let inboundCodeFieldId = '';
    let inboundQtyFieldId = '';
    let fieldMetaMap = {};
    let fieldTypeMap = {};
    let fieldOptionsMap = {};
    let channelFieldOptions = [];
    const TARGET_TABLE_ID = 'tbllRfMWwtznRRJo';
    const INVENTORY_TABLE_NAME = '库存表';
    const INBOUND_TABLE_NAME = '入库表';
    const CODE_FIELD = '备件编码/型号';
    const INVENTORY_QTY_FIELD = '原始库存数量（不动）';
    const INBOUND_QTY_FIELD = '入库数量';
    const MAIN_CODE_FIELD = '商品编码';
    const MAIN_CHANNEL_FIELD = '申请渠道';
    const MAIN_QTY_FIELD = '物品数量';
    const SELF_WAREHOUSE = '自仓库';

    const $ = (id) => document.getElementById(id);
    const CHANNEL_OPTIONS = ['河南', '福州', '佛山', '自仓库', '南京'];

    function isWarehouseToken(t) {
      if (CHANNEL_OPTIONS.includes(t)) return false;
      return t.endsWith('仓') && !t.endsWith('发');
    }

    function normalizeChannel(channel) {
      const c = String(channel ?? '').trim();
      if (!c) return c;
      // 填写「自仓库发」，表格单选项为「自仓库」
      if (c === '自仓库发' || c === '自仓库') return '自仓库';
      if (c.endsWith('发')) {
        const base = c.slice(0, -1).trim();
        if (CHANNEL_OPTIONS.includes(base)) return base;
      }
      return c;
    }

    function log(msg) {
      const b = $('debugBox');
      b.style.display = 'block';
      const line = document.createElement('div');
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      b.appendChild(line);
      b.scrollTop = b.scrollHeight;
    }

    function formatErr(e) {
      if (!e) return 'unknown';
      const parts = [];
      if (e.message) parts.push(e.message);
      else if (e.msg) parts.push(e.msg);
      if (e.code != null) parts.push('code: ' + e.code);
      return parts.length ? parts.join(', ') : String(e);
    }

    function setStatus(kind, desc) {
      const pill = $('sdkPill');
      const descEl = $('sdkDesc');
      pill.className = 'pill ' + kind;
      descEl.textContent = desc;
      if (kind === 'ok') pill.textContent = '已连接';
      else if (kind === 'warn') pill.textContent = '未连接';
      else pill.textContent = '错误';
    }

    function showMsg(type, text) {
      const b = $('msgBox');
      b.className = 'msg ' + type;
      b.textContent = text;
      b.style.display = 'block';
    }

    function hideMsg() {
      const b = $('msgBox');
      b.className = 'msg';
      b.textContent = '';
      b.style.display = 'none';
    }

    function applyTheme(t) {
      document.body.classList.toggle('dark', t === 'DARK');
    }

    async function loadSDK() {
      try {
        const mod = await import('https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk/+esm');
        bitable = mod.bitable || mod.default?.bitable || mod.default || null;
        log('已通过 ESM 模块加载 Base JS SDK');
      } catch (e1) {
        log('ESM 模块加载失败：' + (e1?.message || e1));
        bitable = window.bitable || window?.lark?.bitable || null;
        if (bitable) log('已从全局对象读取到 SDK');
      }

      if (!bitable || !bitable.base) {
        sdkReady = false;
        setStatus('warn', '未检测到飞书 SDK。请确保该页面是从飞书多维表格侧边栏插件中打开，而不是直接在浏览器里打开。');
        showMsg('error', '未检测到飞书 SDK。请在飞书多维表格侧边栏插件里运行此页面。');
        $('confirmBtn').disabled = true;
        return;
      }

      sdkReady = true;
      setStatus('ok', 'SDK 已就绪，正在读取目标表…');

      try {
        const theme = await bitable.bridge.getTheme();
        applyTheme(theme);
        bitable.bridge.onThemeChange((ev) => applyTheme(ev.data.theme));
      } catch (e) {
        log('主题读取失败：' + (e?.message || e));
      }

      await refreshActiveTable();
      await refreshInventoryTable();
      await refreshInboundTable();
      log('当前库存查询：库存表+入库表−总表自仓库（实时计算，无缓存）');
    }

    async function refreshActiveTable() {
      try {
        currentTable = await bitable.base.getTableById(TARGET_TABLE_ID);
        const meta = await currentTable.getMeta();
        currentTableName = meta?.name || '总表';
        $('sdkDesc').textContent = `已固定连接到：${currentTableName}（${meta?.id || TARGET_TABLE_ID}）`;

        const metaList = await currentTable.getFieldMetaList();
        fieldMetaMap = {};
        fieldTypeMap = {};
        fieldOptionsMap = {};
        for (const f of metaList) {
          fieldMetaMap[f.name] = f.id;
          fieldTypeMap[f.name] = f.type;
          if (f.property?.options?.length) {
            fieldOptionsMap[f.name] = f.property.options;
          }
        }
        const channelMeta = metaList.find((f) => f.name === '申请渠道');
        if (channelMeta?.property?.options?.length) {
          channelFieldOptions = channelMeta.property.options;
        }
        await loadChannelFieldOptions();
        $('confirmBtn').disabled = false;
      } catch (e) {
        log('读取目标表失败：' + (e?.message || e));
        setStatus('err', '读取目标表失败。');
        showMsg('error', '已检测到 SDK，但无法读取总表 ID：' + TARGET_TABLE_ID + '。请确认该表存在且当前账号有权限。');
        $('confirmBtn').disabled = true;
      }
    }

    function normalizeProductCode(code) {
      return String(code ?? '')
        .trim()
        .replace(/\s+/g, '')
        .replace(/\.0+$/, '');
    }

    function cellToText(val) {
      if (val == null) return '';
      if (typeof val === 'string') return val.trim();
      if (typeof val === 'number') return String(Math.trunc(val));
      if (Array.isArray(val)) {
        return val.map((seg) => (seg && seg.text != null ? String(seg.text) : '')).join('').trim();
      }
      if (typeof val === 'object' && val.text != null) return String(val.text).trim();
      return String(val).trim();
    }

    function cellToNumber(val) {
      if (val == null) return 0;
      if (typeof val === 'number' && Number.isFinite(val)) return val;
      const text = cellToText(val).replace(/,/g, '');
      const num = parseFloat(text);
      return Number.isFinite(num) ? num : 0;
    }

    async function loadTablePage(table, pageToken, filter) {
      const params = { pageSize: 200, pageToken, stringValue: true };
      if (filter) params.filter = filter;
      return await table.getRecordsByPage(params);
    }

    function buildCodeFilter(codeFieldId, code) {
      return {
        conjunction: 'and',
        conditions: [{ fieldId: codeFieldId, operator: 'is', value: [code] }],
      };
    }

    function buildMainCodeFilter(code, channel) {
      const codeFieldId = fieldMetaMap[MAIN_CODE_FIELD];
      if (!codeFieldId) return null;
      const conditions = [{ fieldId: codeFieldId, operator: 'is', value: [code] }];
      const channelName = normalizeChannel(channel);
      const channelFieldId = fieldMetaMap[MAIN_CHANNEL_FIELD];
      if (channelName && channelFieldId) {
        conditions.push({ fieldId: channelFieldId, operator: 'is', value: [channelName] });
      }
      return { conjunction: 'and', conditions };
    }

    function rowChannelText(rec, channelFieldId) {
      const raw = rec.fields[channelFieldId];
      if (raw == null) return '';
      if (typeof raw === 'string') return normalizeChannel(raw);
      if (typeof raw === 'object' && raw.text != null) return normalizeChannel(raw.text);
      return normalizeChannel(cellToText(raw));
    }

    function parseCodeAndProduct(tokens) {
      const first = (tokens[0] || '').trim();
      if (!first) return { code: '', productType: '', qty: '1', idx: 1 };

      // 连写：11002015023381排水泵5件 / 17400802003153T主板5个
      const glued = first.match(new RegExp(`^(\\d+[A-Za-z0-9]*)(.+?(\\d+(?:\\.\\d+)?)${QTY_UNIT_PATTERN})$`));
      if (glued) {
        const productCore = glued[2].replace(new RegExp(`(\\d+(?:\\.\\d+)?)${QTY_UNIT_PATTERN}$`), '').trim();
        return {
          code: glued[1],
          productType: productCore || glued[2],
          qty: glued[3],
          idx: 1,
        };
      }

      const code = first;
      const parsed = parseProductAndQty(tokens[1] || '', tokens[2] || '');
      return { code, productType: parsed.productType, qty: parsed.qty, idx: 1 + parsed.consumed };
    }

    async function sumQtyByCode(table, codeFieldId, qtyFieldId, code, options = {}) {
      const normalized = normalizeProductCode(code);
      if (!table || !codeFieldId || !qtyFieldId || !normalized) {
        return { total: 0, pages: 0, rows: 0, filterMode: 'none' };
      }

      const { filter, filterFallback, channelFieldId, channelValue } = options;
      let total = 0;
      let pages = 0;
      let rows = 0;
      let filterMode = 'none';

      const runQuery = async (activeFilter) => {
        total = 0;
        pages = 0;
        rows = 0;
        let pageToken;
        let hasMore = true;
        const needChannel = !!(channelFieldId && channelValue && activeFilter?.conditions?.length > 1);
        const channelNorm = needChannel ? normalizeChannel(channelValue) : '';
        while (hasMore) {
          const res = await loadTablePage(table, pageToken, activeFilter || undefined);
          const batch = res.records || [];
          if (activeFilter && batch.length > 0) {
            const filterBroken = batch.some((rec) => {
              const rowCode = normalizeProductCode(cellToText(rec.fields[codeFieldId]));
              if (rowCode !== normalized) return true;
              if (needChannel && channelNorm !== rowChannelText(rec, channelFieldId)) return true;
              return false;
            });
            if (filterBroken) throw new Error('filter_not_applied');
          }
          pages += 1;
          for (const rec of batch) {
            let rowCode = normalizeProductCode(cellToText(rec.fields[codeFieldId]));
            if (!rowCode) continue;
            if (rowCode !== normalized) continue;
            if (channelFieldId && normalizeChannel(channelValue) !== rowChannelText(rec, channelFieldId)) {
              continue;
            }
            total += cellToNumber(rec.fields[qtyFieldId]);
            rows += 1;
          }
          hasMore = !!res.hasMore;
          pageToken = res.pageToken;
        }
      };

      const attempts = [];
      if (filter) attempts.push({ filter, mode: 'full' });
      if (filterFallback) attempts.push({ filter: filterFallback, mode: 'code' });
      attempts.push({ filter: null, mode: 'none' });

      for (let i = 0; i < attempts.length; i++) {
        try {
          await runQuery(attempts[i].filter);
          filterMode = attempts[i].mode;
          break;
        } catch (e) {
          if (i === attempts.length - 1) throw e;
        }
      }

      return { total, pages, rows, filterMode };
    }

    async function refreshInventoryTable() {
      inventoryTable = null;
      inventoryTableName = '';
      inventoryCodeFieldId = '';
      inventoryQtyFieldId = '';

      try {
        inventoryTable = await bitable.base.getTableByName(INVENTORY_TABLE_NAME);
        const meta = await inventoryTable.getMeta();
        inventoryTableName = meta?.name || INVENTORY_TABLE_NAME;

        const metaList = await inventoryTable.getFieldMetaList();
        const codeMeta = metaList.find((f) => f.name === CODE_FIELD);
        const qtyMeta = metaList.find((f) => f.name === INVENTORY_QTY_FIELD);

        if (!codeMeta || !qtyMeta) {
          log('库存表缺少字段：' + CODE_FIELD + '、' + INVENTORY_QTY_FIELD);
          inventoryTable = null;
          return;
        }

        inventoryCodeFieldId = codeMeta.id;
        inventoryQtyFieldId = qtyMeta.id;
        log('已连接库存表：' + inventoryTableName);
      } catch (e) {
        log('连接库存表失败：' + (e?.message || e));
        inventoryTable = null;
      }
    }

    async function refreshInboundTable() {
      inboundTable = null;
      inboundCodeFieldId = '';
      inboundQtyFieldId = '';

      try {
        inboundTable = await bitable.base.getTableByName(INBOUND_TABLE_NAME);
        const meta = await inboundTable.getMeta();
        const metaList = await inboundTable.getFieldMetaList();
        const codeMeta = metaList.find((f) => f.name === CODE_FIELD);
        const qtyMeta = metaList.find((f) => f.name === INBOUND_QTY_FIELD);

        if (!codeMeta || !qtyMeta) {
          log('入库表缺少字段：' + CODE_FIELD + '、' + INBOUND_QTY_FIELD);
          inboundTable = null;
          return;
        }

        inboundCodeFieldId = codeMeta.id;
        inboundQtyFieldId = qtyMeta.id;
        log('已连接入库表：' + (meta?.name || INBOUND_TABLE_NAME));
      } catch (e) {
        log('连接入库表失败：' + (e?.message || e));
        inboundTable = null;
      }
    }

    async function computeAvailableStock(productCode) {
      const code = normalizeProductCode(productCode);
      if (!code) {
        return { qty: 0, hasStock: false, detail: null, elapsed: 0 };
      }

      const t0 = performance.now();
      const tasks = [];

      if (inventoryTable && inventoryCodeFieldId && inventoryQtyFieldId) {
        tasks.push(
          sumQtyByCode(inventoryTable, inventoryCodeFieldId, inventoryQtyFieldId, code, {
            filter: buildCodeFilter(inventoryCodeFieldId, code),
          }).then((r) => ({ key: 'inventory', ...r }))
        );
      } else {
        tasks.push(Promise.resolve({ key: 'inventory', total: 0, pages: 0, rows: 0 }));
      }

      if (inboundTable && inboundCodeFieldId && inboundQtyFieldId) {
        tasks.push(
          sumQtyByCode(inboundTable, inboundCodeFieldId, inboundQtyFieldId, code, {
            filter: buildCodeFilter(inboundCodeFieldId, code),
          }).then((r) => ({ key: 'inbound', ...r }))
        );
      } else {
        tasks.push(Promise.resolve({ key: 'inbound', total: 0, pages: 0, rows: 0 }));
      }

      if (currentTable && fieldMetaMap[MAIN_CODE_FIELD] && fieldMetaMap[MAIN_QTY_FIELD]) {
        const mainCodeId = fieldMetaMap[MAIN_CODE_FIELD];
        const mainQtyId = fieldMetaMap[MAIN_QTY_FIELD];
        const mainChannelId = fieldMetaMap[MAIN_CHANNEL_FIELD];
        tasks.push(
          sumQtyByCode(currentTable, mainCodeId, mainQtyId, code, {
            filter: buildMainCodeFilter(code, SELF_WAREHOUSE),
            filterFallback: buildCodeFilter(mainCodeId, code),
            channelFieldId: mainChannelId,
            channelValue: SELF_WAREHOUSE,
          }).then((r) => ({ key: 'applied', ...r }))
        );
      } else {
        tasks.push(Promise.resolve({ key: 'applied', total: 0, pages: 0, rows: 0 }));
      }

      const parts = await Promise.all(tasks);
      const map = {};
      for (const p of parts) map[p.key] = p;

      const inventory = map.inventory?.total || 0;
      const inbound = map.inbound?.total || 0;
      const applied = map.applied?.total || 0;
      const qty = Math.max(0, inventory + inbound - applied);
      const pages = (map.inventory?.pages || 0) + (map.inbound?.pages || 0) + (map.applied?.pages || 0);
      const elapsed = ((performance.now() - t0) / 1000).toFixed(1);

      return {
        qty,
        hasStock: qty > 0,
        detail: {
          inventory,
          inbound,
          applied,
          pages,
          appliedRows: map.applied?.rows || 0,
          appliedPages: map.applied?.pages || 0,
          appliedFilterMode: map.applied?.filterMode || 'none',
        },
        elapsed,
      };
    }

    function isSelfWarehouseChannel(channel) {
      return normalizeChannel(channel) === '自仓库';
    }

    function pad2(n) { return String(n).padStart(2, '0'); }

    function formatDateParts(now) {
      const dateStr = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())}`;
      const dateTimeStr = `${dateStr} ${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
      return {
        dateStr,
        dateTimeStr,
        todayMs: new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(),
        nowMs: now.getTime()
      };
    }

    function normalizeText(raw) {
      return String(raw || '')
        .trim()
        .replace(/，/g, ',')
        .replace(/\r\n/g, '\n')
        .replace(/\n+/g, ' ')
        .replace(/\s+/g, ' ');
    }

    const QTY_UNIT_CHARS = '个件只条台套盒包瓶箱把张片组对副根卷块册本米';
    const QTY_UNIT_PATTERN = '(?:' + [...QTY_UNIT_CHARS].join('|') + ')';

    function parseProductAndQty(productRaw, nextToken) {
      const raw = String(productRaw || '').trim();
      if (!raw) return { productType: '', qty: '1', consumed: 1 };

      // 连写：主板5个 / 传感器20条 / 排水泵5件
      const inline = raw.match(new RegExp(`^(.+?)(\\d+(?:\\.\\d+)?)${QTY_UNIT_PATTERN}$`));
      if (inline && inline[1].trim()) {
        return { productType: inline[1].trim(), qty: inline[2].trim(), consumed: 1 };
      }

      // 分开：主板 5个
      if (nextToken) {
        const separate = String(nextToken).trim().match(new RegExp(`^(\\d+(?:\\.\\d+)?)${QTY_UNIT_PATTERN}$`));
        if (separate) {
          return { productType: raw, qty: separate[1].trim(), consumed: 2 };
        }
      }

      return { productType: raw, qty: '1', consumed: 1 };
    }

    function parseOrder(raw) {
      if (!raw || !raw.trim()) return { ok: false, error: '请先输入订单文字' };

      const norm = String(raw).trim().replace(/，/g, ',');
      const parts = norm.split(',').map(s => s.trim()).filter(Boolean);
      if (parts.length < 4) {
        return { ok: false, error: `格式不符：需要至少 4 段逗号分隔内容，当前只有 ${parts.length} 段` };
      }

      const name = parts[0];
      const phone = parts[1];
      const addr = parts[2];
      const rest = parts.slice(3).join(' ').trim();
      const tokens = normalizeText(rest).split(' ').filter(Boolean);

      if (tokens.length < 2) {
        return { ok: false, error: '商品信息段格式不符：至少需要「商品编码 商品名数量单位」' };
      }

      const codeParsed = parseCodeAndProduct(tokens);
      const code = codeParsed.code;
      let idx = codeParsed.idx;
      const productType = codeParsed.productType;
      const qty = codeParsed.qty;

      const remaining = tokens.slice(idx);
      let channel = '';
      let channelRaw = '';
      let warehouse = '';
      let houseCommercial = '';
      let wechatSingle = '';
      const logisticsTokens = [];

      for (const token of remaining) {
        const t = token.trim();
        if (!t) continue;

        if (t === '微信单') {
          wechatSingle = '微信单';
          continue;
        }

        if (t === '商用件' || t === '商用') {
          houseCommercial = '商用';
          continue;
        }
        if (t === '家用件' || t === '家用') {
          houseCommercial = '家用';
          continue;
        }

        if (!channel && t.endsWith('发')) {
          const candidate = t.slice(0, -1).trim();
          if (candidate) {
            channelRaw = t;
            channel = normalizeChannel(candidate);
            continue;
          }
        }

        if (!channel && CHANNEL_OPTIONS.includes(t)) {
          channelRaw = t;
          channel = t;
          continue;
        }

        if (isWarehouseToken(t)) {
          warehouse = t;
          continue;
        }

        if (channel) logisticsTokens.push(t);
      }

      const logistics = logisticsTokens.join(' ').trim();

      const missing = [];
      if (!name) missing.push('收货姓名');
      if (!phone) missing.push('收货电话');
      if (!addr) missing.push('地址');
      if (!code) missing.push('商品编码');
      if (!productType) missing.push('商品类型');
      if (!qty) missing.push('物品数量');
      if (!channel) missing.push('申请渠道');

      if (missing.length) return { ok: false, error: '以下字段未能识别：' + missing.join('、') };

      return {
        ok: true,
        data: {
          name,
          phone,
          addr,
          code,
          productType,
          qty,
          channel: normalizeChannel(channel),
          channelRaw: channelRaw || channel,
          warehouse,
          houseCommercial,
          wechatSingle,
          logistics
        }
      };
    }

    function setField(id, val, muted = false) {
      const el = $(id);
      if (!el) return;
      el.className = 'field-value' + (muted ? ' muted' : '') + (!val ? ' empty' : '');
      el.textContent = val || (muted ? '无' : '未识别');
    }

    function setStockField(id, val, danger = false) {
      const el = $(id);
      if (!el) return;
      el.className = 'field-value' + (danger ? ' danger' : '');
      el.textContent = val;
    }

    async function updateStockPreview(data) {
      const stockRow = $('stockRow');
      if (!stockRow) return;

      if (!isSelfWarehouseChannel(data.channel)) {
        stockRow.classList.remove('visible');
        return;
      }

      stockRow.classList.add('visible');
      setStockField('f-has-stock', '查询中…', false);
      setStockField('f-stock-qty', '查询中…', false);

      try {
        const stock = await computeAvailableStock(data.code);
        const qty = stock.qty;
        const d = stock.detail;

        log('商品编码：' + data.code);
        if (d) {
          const appliedNote = d.appliedRows != null
            ? `（${d.appliedRows}条${d.appliedPages ? '，' + d.appliedPages + '页' : ''}）`
            : '';
          log(`原始库存${d.inventory} + 入库${d.inbound} − 总表自仓库占用${d.applied}${appliedNote} = ${qty}（${stock.elapsed}秒）`);
          if (d.appliedFilterMode === 'none' && (d.appliedPages || 0) > 1) {
            log('提示：总表「编码+自仓库」过滤未生效，已全表扫描，查询偏慢');
          } else if (d.appliedFilterMode === 'code' && (d.appliedPages || 0) > 1) {
            log('提示：总表仅按编码过滤，自仓库在本地筛选');
          }
        } else {
          log('库存数量：' + qty);
        }

        if (qty <= 0) {
          setStockField('f-has-stock', '无', true);
          setStockField('f-stock-qty', '0', true);
        } else {
          setStockField('f-has-stock', '有', false);
          setStockField('f-stock-qty', String(qty), false);
        }
      } catch (e) {
        log('库存预览失败：' + (e?.message || e));
        setStockField('f-has-stock', '查询失败', true);
        setStockField('f-stock-qty', '-', true);
      }
    }

    function resolveDateOnlyFieldName() {
      const exact = ['申请日期（年月日）', '申请日期td（年月日）'];
      for (const n of exact) {
        if (fieldMetaMap[n]) return n;
      }
      for (const name of Object.keys(fieldMetaMap)) {
        if (name.includes('年月日') && !name.includes('时分秒')) return name;
      }
      return '';
    }

    function resolveDateTimeFieldName() {
      const exact = ['申请日期（年月日时分秒）'];
      for (const n of exact) {
        if (fieldMetaMap[n]) return n;
      }
      for (const name of Object.keys(fieldMetaMap)) {
        if (name.includes('时分秒')) return name;
      }
      return '';
    }

    function mergeFieldOptions(...lists) {
      const merged = new Map();
      for (const list of lists) {
        for (const o of list || []) {
          if (o?.id) merged.set(o.id, o);
        }
      }
      return [...merged.values()];
    }

    async function fetchFieldOptions(fieldName) {
      const field = await currentTable.getField(fieldName);
      const lists = [fieldOptionsMap[fieldName] || []];
      if (fieldName === '申请渠道' && channelFieldOptions.length) {
        lists.push(channelFieldOptions);
      }
      try {
        const meta = await field.getMeta();
        if (meta?.property?.options?.length) lists.push(meta.property.options);
      } catch (_) {}
      try {
        if (typeof field.getOptions === 'function') {
          const live = await field.getOptions();
          if (live?.length) lists.push(live);
        }
      } catch (_) {}
      const merged = mergeFieldOptions(...lists);
      if (merged.length) {
        fieldOptionsMap[fieldName] = merged;
        if (fieldName === '申请渠道') channelFieldOptions = merged;
      }
      return merged;
    }

    async function loadChannelFieldOptions() {
      if (!currentTable) return;
      try {
        await fetchFieldOptions('申请渠道');
      } catch (_) {}
    }

    function resolveSelectOption(fieldName, rawValue, options) {
      const value = fieldName === '申请渠道' ? normalizeChannel(rawValue) : String(rawValue ?? '').trim();
      if (!value || !options?.length) return null;
      return options.find((o) => o.name === value) || null;
    }

    async function createFieldCell(fieldName, value) {
      if (value === undefined || value === null || value === '') return null;
      if (fieldOptionsMap[fieldName]?.length) {
        return await createSelectFieldCell(fieldName, value);
      }
      const field = await currentTable.getField(fieldName);
      return await field.createCell(value);
    }

    async function createSelectFieldCell(fieldName, rawValue) {
      const value = fieldName === '申请渠道' ? normalizeChannel(rawValue) : String(rawValue ?? '').trim();
      if (!value) return null;

      const field = await currentTable.getField(fieldName);
      const options = await fetchFieldOptions(fieldName);
      const opt = resolveSelectOption(fieldName, value, options);
      const attempts = [value];
      if (opt) {
        attempts.push(opt.name, { id: opt.id, text: opt.name }, opt.id);
      }

      let lastErr = null;
      for (const val of attempts) {
        try {
          return await field.createCell(val);
        } catch (e) {
          lastErr = e;
        }
      }

      throw lastErr || new Error('无法匹配选项：' + value);
    }

    async function setSelectFieldValue(recordId, fieldName, rawValue) {
      const value = fieldName === '申请渠道' ? normalizeChannel(rawValue) : String(rawValue ?? '').trim();
      if (!value || !recordId) return false;

      const field = await currentTable.getField(fieldName);
      const options = await fetchFieldOptions(fieldName);
      const opt = resolveSelectOption(fieldName, value, options);
      const attempts = [value];
      if (opt) {
        attempts.push(opt.name, opt.id, { id: opt.id, text: opt.name });
      }

      for (const val of attempts) {
        try {
          await field.setValue(recordId, val);
          return true;
        } catch (_) {}
      }
      return false;
    }

    async function setPreviewValues(data) {
      const now = new Date();
      const { dateStr, dateTimeStr } = formatDateParts(now);

      await updateStockPreview(data);

      setField('f-name', data.name);
      setField('f-phone', data.phone);
      setField('f-addr', data.addr);
      setField('f-code', data.code);
      setField('f-type', data.productType);
      setField('f-qty', data.qty);
      setField('f-channel', normalizeChannel(data.channel));
      setField('f-warehouse', data.warehouse || '', true);
      setField('f-house', data.houseCommercial || '');
      setField('f-wechat', data.wechatSingle || '');
      setField('f-logistics', data.logistics, true);
      setField('f-date', dateStr);
      setField('f-datetime', dateTimeStr);
    }

    async function doParse() {
      hideMsg();
      const raw = $('input').value;
      const result = parseOrder(raw);
      if (!result.ok) {
        parsed = null;
        $('confirmBtn').disabled = true;
        showMsg('error', result.error);
        $('placeholder').style.display = 'block';
        $('fields').style.display = 'none';
        $('badge').style.display = 'none';
        $('stockRow')?.classList.remove('visible');
        return;
      }

      parsed = result.data;

      $('placeholder').style.display = 'none';
      $('fields').style.display = 'grid';

      const badge = $('badge');
      badge.style.display = 'inline-flex';
      badge.className = 'pill ok';
      badge.textContent = '识别正常';

      try {
        await setPreviewValues(parsed);
      } catch (e) {
        showMsg('error', '预览失败：' + (e?.message || e));
      }

      $('confirmBtn').disabled = !sdkReady;
    }

    async function doConfirm() {
      hideMsg();

      if (!parsed) {
        showMsg('error', '请先点击「拆分预览」确认文本格式。');
        return;
      }
      if (!sdkReady || !bitable || !currentTable) {
        showMsg('error', '未连接到飞书 SDK，请在飞书多维表格侧边栏插件里打开此页面。');
        return;
      }

      const now = new Date();
      const { todayMs, nowMs } = formatDateParts(now);

      try {
        $('confirmBtn').disabled = true;
        $('confirmBtn').textContent = '写入中…';

        const cells = [];
        const pushCell = async (fieldName, value) => {
          try {
            const cell = await createFieldCell(fieldName, value);
            if (cell) cells.push(cell);
          } catch (e) {
            log(`字段「${fieldName}」写入失败：${formatErr(e)}`);
          }
        };

        await pushCell('收货姓名', parsed.name);
        await pushCell('收货电话', parsed.phone);
        await pushCell('地址', parsed.addr);
        await pushCell('商品编码', parsed.code);
        await pushCell('商品类型', parsed.productType);
        await pushCell('物品数量', Number(parsed.qty) || 1);

        let channelCell = null;
        if (parsed.channel) {
          try {
            channelCell = await createSelectFieldCell('申请渠道', parsed.channel);
          } catch (_) {}
          if (channelCell) cells.push(channelCell);
        }

        let houseCell = null;
        if (parsed.houseCommercial) {
          try {
            houseCell = await createSelectFieldCell('家商用', parsed.houseCommercial);
          } catch (_) {}
          if (houseCell) cells.push(houseCell);
        }

        if (parsed.warehouse) await pushCell('仓库', parsed.warehouse);
        if (parsed.wechatSingle) await pushCell('微信单', parsed.wechatSingle);
        if (parsed.logistics) await pushCell('物流备注', parsed.logistics);

        const dateOnlyName = resolveDateOnlyFieldName();
        const dateTimeName = resolveDateTimeFieldName();
        if (dateOnlyName) await pushCell(dateOnlyName, todayMs);
        if (dateTimeName) await pushCell(dateTimeName, nowMs);

        if (!cells.length) {
          throw new Error('没有可写入的字段，请检查总表字段名是否与插件一致');
        }

        const recordId = await currentTable.addRecord(cells);

        if (parsed.channel && !channelCell) {
          const ok = await setSelectFieldValue(recordId, '申请渠道', parsed.channel);
          if (!ok) {
            const opts = fieldOptionsMap['申请渠道'] || [];
            const hint = opts.length ? '（可选：' + opts.map((o) => o.name).join('、') + '）' : '';
            log('申请渠道写入失败：无法匹配选项「' + parsed.channel + '」' + hint);
          }
        }
        if (parsed.houseCommercial && !houseCell) {
          const ok = await setSelectFieldValue(recordId, '家商用', parsed.houseCommercial);
          if (!ok) {
            const opts = fieldOptionsMap['家商用'] || [];
            const hint = opts.length ? '（可选：' + opts.map((o) => o.name).join('、') + '）' : '';
            log('字段「家商用」写入失败：无法匹配选项「' + parsed.houseCommercial + '」' + hint);
          }
        }
        if (parsed.channelRaw && parsed.channelRaw !== parsed.channel) {
          log('申请渠道：' + parsed.channelRaw + ' → ' + parsed.channel);
        }

        showMsg('success', '写入成功');
        log('写入成功');

        doReset(false);
      } catch (e) {
        log('写入失败：' + formatErr(e));
        if (e?.stack) log('Stack: ' + e.stack);
        showMsg('error', '写入失败：' + formatErr(e));
      } finally {
        $('confirmBtn').textContent = '✓ 写入总表';
        $('confirmBtn').disabled = !sdkReady;
      }
    }

    function doReset(clearInput = true) {
      hideMsg();
      parsed = null;
      $('badge').style.display = 'none';
      $('placeholder').style.display = 'block';
      $('fields').style.display = 'none';
      $('confirmBtn').disabled = !sdkReady;
      if (clearInput) $('input').value = '';
      $('stockRow')?.classList.remove('visible');
      const ids = ['f-has-stock','f-stock-qty','f-name','f-phone','f-addr','f-code','f-type','f-qty','f-channel','f-warehouse','f-house','f-wechat','f-logistics','f-date','f-datetime'];
      for (const id of ids) {
        const el = $(id);
        if (el) {
          el.textContent = '';
          el.className = 'field-value';
        }
      }
    }

    window.doParse = doParse;
    window.doConfirm = doConfirm;
    window.doReset = doReset;

    (async function main() {
      log('开始初始化…');
      try {
        await loadSDK();
      } catch (e) {
        log('初始化异常：' + (e?.message || e));
        setStatus('err', '初始化失败。');
        showMsg('error', '初始化失败：' + (e?.message || e));
      }
    })();
  </script>
</body>
</html>

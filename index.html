<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单文字拆分</title>
  <script src="https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.2.1/dist/index.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Tahoma,
        "PingFang SC", "Microsoft Yahei", Arial, sans-serif;
      font-size: 14px; color: #1f2329; background: #fff; padding: 16px;
    }
    body.dark { background: #252525; color: #e0e0e0; }
    h2 { font-size: 16px; font-weight: 500; margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #8f959e; margin-bottom: 5px; }
    body.dark label { color: #9e9e9e; }
    textarea {
      width: 100%; min-height: 90px; padding: 8px 10px;
      border: 1px solid #dee0e3; border-radius: 6px;
      font-size: 13px; line-height: 1.6; resize: vertical;
      background: #fff; color: #1f2329; font-family: inherit; outline: none;
    }
    textarea:focus { border-color: #1456f0; }
    body.dark textarea { background: #333; border-color: #434343; color: #e0e0e0; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      padding: 7px 16px; border-radius: 6px; border: 1px solid #dee0e3;
      font-size: 13px; cursor: pointer; background: #fff; color: #1f2329;
      font-family: inherit; transition: background 0.15s;
    }
    button:hover { background: #f2f3f5; }
    button.primary { background: #1456f0; color: #fff; border-color: transparent; }
    button.primary:hover { background: #0e48d0; }
    button.primary:disabled { background: #a0b4f7; cursor: not-allowed; }
    button.ghost { margin-left: auto; color: #8f959e; border-color: transparent; background: transparent; }
    body.dark button { background: #333; border-color: #434343; color: #e0e0e0; }
    body.dark button.primary { background: #4571e1; border-color: transparent; color: #fff; }
    body.dark button.primary:disabled { background: #2c3e6e; }
    .table-wrap { margin-top: 12px; display: none; }
    select {
      width: 100%; padding: 7px 10px; border: 1px solid #dee0e3;
      border-radius: 6px; font-size: 13px; background: #fff;
      color: #1f2329; font-family: inherit; outline: none; margin-top: 5px;
    }
    body.dark select { background: #333; border-color: #434343; color: #e0e0e0; }
    .msg {
      margin-top: 12px; padding: 9px 12px; border-radius: 6px;
      font-size: 13px; display: none; line-height: 1.5;
    }
    .msg.error { background: #fff0f0; color: #d32f2f; display: block; }
    .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    body.dark .msg.error { background: #3b1c1c; color: #ef9a9a; }
    body.dark .msg.success { background: #1b2e1b; color: #a5d6a7; }
    .card { border: 1px solid #dee0e3; border-radius: 8px; overflow: hidden; margin-top: 14px; }
    body.dark .card { border-color: #434343; }
    .card-header {
      padding: 8px 14px; background: #f2f3f5; font-size: 12px; font-weight: 500;
      color: #646a73; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #dee0e3;
    }
    body.dark .card-header { background: #2e2e2e; color: #9e9e9e; border-color: #434343; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #e8f5e9; color: #2e7d32; }
    .badge.warn { background: #fff8e1; color: #f57f17; }
    .placeholder { padding: 24px; text-align: center; color: #8f959e; font-size: 13px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; }
    .field { padding: 10px 14px; border-bottom: 1px solid #dee0e3; border-right: 1px solid #dee0e3; }
    .field.full { grid-column: 1 / -1; border-right: none; }
    .field:nth-child(even):not(.full) { border-right: none; }
    .field:last-child, .field:nth-last-child(2):not(.full) { border-bottom: none; }
    body.dark .field { border-color: #3a3a3a; }
    .field-label { font-size: 10px; color: #8f959e; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
    .field-value { font-size: 13px; font-weight: 500; color: #1f2329; word-break: break-all; }
    body.dark .field-value { color: #e0e0e0; }
    .field-value.empty { color: #c9cdd4; font-weight: 400; font-style: italic; }
    .field-value.muted { color: #8f959e; font-weight: 400; }
    .divider { height: 1px; background: #dee0e3; margin: 12px 0; }
    body.dark .divider { background: #3a3a3a; }
    .debug-box {
      margin-top: 10px; padding: 8px 10px; background: #f7f8fa;
      border-radius: 6px; font-size: 11px; color: #646a73;
      word-break: break-all; line-height: 1.6; display: none;
      max-height: 200px; overflow-y: auto;
    }
    body.dark .debug-box { background: #2a2a2a; color: #9e9e9e; }
  </style>
</head>
<body>
  <h2>📦 订单文字拆分</h2>

  <label>粘贴订单文字（支持中英文逗号）</label>
  <textarea id="input" placeholder="例：陈文永，18825732781-2867，广东省 东莞市 虎门镇，12100103000078 风轮1个 自仓库发 顺丰陆运到付"></textarea>

  <div class="btn-row">
    <button onclick="doParse()">拆分预览</button>
    <button class="primary" id="confirmBtn" onclick="doConfirm()" disabled>✓ 写入个人表</button>
    <button class="ghost" onclick="doReset()">清空</button>
  </div>

  <div class="table-wrap" id="tableWrap">
    <div class="divider"></div>
    <label>写入到哪张表？</label>
    <select id="tableSelect"></select>
  </div>

  <div class="msg" id="msgBox"></div>

  <div class="card">
    <div class="card-header">
      <span>拆分预览</span>
      <span class="badge" id="badge" style="display:none"></span>
    </div>
    <div class="placeholder" id="placeholder">请在上方输入文字后点击「拆分预览」</div>
    <div class="fields" id="fields" style="display:none">
      <div class="field"><div class="field-label">收货姓名</div><div class="field-value" id="f-name"></div></div>
      <div class="field"><div class="field-label">收货电话</div><div class="field-value" id="f-phone"></div></div>
      <div class="field full"><div class="field-label">地址</div><div class="field-value" id="f-addr"></div></div>
      <div class="field full"><div class="field-label">商品编码</div><div class="field-value" id="f-code"></div></div>
      <div class="field"><div class="field-label">商品类型</div><div class="field-value" id="f-type"></div></div>
      <div class="field"><div class="field-label">物品数量</div><div class="field-value" id="f-qty"></div></div>
      <div class="field"><div class="field-label">申请渠道</div><div class="field-value" id="f-channel"></div></div>
      <div class="field"><div class="field-label">物流备注</div><div class="field-value muted" id="f-logistics"></div></div>
      <div class="field"><div class="field-label">申请日期（年月日）</div><div class="field-value" id="f-date"></div></div>
      <div class="field"><div class="field-label">申请日期（年月日时分秒）</div><div class="field-value" id="f-datetime"></div></div>
    </div>
  </div>

  <!-- 调试区，出错时展示详细信息 -->
  <div class="debug-box" id="debugBox"></div>

  <script>
    let sdk = null;
    let parsed = null;

    // ── 飞书文本字段格式 ──
    function tv(str) {
      return [{ type: 'text', text: String(str) }];
    }

    // ── SDK 初始化 ──
    async function initSDK() {
      try {
        sdk = window.bitable;
        if (!sdk) { log('未检测到飞书SDK，演示模式'); return; }

        const theme = await sdk.bridge.getTheme();
        applyTheme(theme);
        sdk.bridge.onThemeChange(e => applyTheme(e.data.theme));

        const metaList = await sdk.base.getTableMetaList();
        log('找到 ' + metaList.length + ' 张表：' + metaList.map(m => m.name).join('、'));

        const sel = document.getElementById('tableSelect');
        metaList.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name;
          sel.appendChild(opt);
        });
        if (metaList.length > 0) document.getElementById('tableWrap').style.display = 'block';
      } catch (e) {
        log('SDK初始化错误：' + e.message);
      }
    }

    function applyTheme(t) { document.body.classList.toggle('dark', t === 'DARK'); }

    function log(msg) {
      const b = document.getElementById('debugBox');
      b.style.display = 'block';
      b.innerHTML += '<div>' + new Date().toLocaleTimeString() + ' ' + msg + '</div>';
    }

    // ── 拆分逻辑 ──
    function parseOrder(raw) {
      if (!raw || !raw.trim()) return { ok: false, error: '请先输入订单文字' };
      const norm = raw.trim().replace(/，/g, ',');
      const parts = norm.split(',');
      if (parts.length < 4) return { ok: false, error: '格式不符：需要至少4个逗号分隔段，当前只有 ' + parts.length + ' 段' };

      const name  = parts[0].trim();
      const phone = parts[1].trim();
      const addr  = parts[2].trim();
      const rest  = parts.slice(3).join(',').trim();
      const segs  = rest.split(/\s+/);
      if (segs.length < 3) return { ok: false, error: '商品信息段格式不符，需要"编码 商品描述 渠道发"三段空格分隔' };

      const code       = segs[0].trim();
      const productRaw = segs[1].trim();
      const numMatch   = productRaw.match(/^([^\d]+)(\d+)/);
      let productType  = productRaw, qty = '';
      if (numMatch) { productType = numMatch[1].trim(); qty = numMatch[2].trim(); }

      const channelRaw = segs[2].trim();
      const faIdx      = channelRaw.lastIndexOf('发');
      const channel    = faIdx !== -1 ? channelRaw.substring(0, faIdx).trim() : channelRaw;
      const logistics  = segs.length >= 4 ? segs.slice(3).join('') : '';

      const missing = [];
      if (!name) missing.push('收货姓名');
      if (!phone) missing.push('收货电话');
      if (!addr) missing.push('地址');
      if (!code) missing.push('商品编码');
      if (!productType) missing.push('商品类型');
      if (!qty) missing.push('物品数量');
      if (!channel) missing.push('申请渠道');
      if (missing.length > 0) return { ok: false, error: '以下字段未能识别：' + missing.join('、') };

      return { ok: true, data: { name, phone, addr, code, productType, qty, channel, logistics } };
    }

    function showMsg(type, text) {
      const b = document.getElementById('msgBox');
      b.className = 'msg ' + type; b.textContent = text;
    }
    function hideMsg() { document.getElementById('msgBox').className = 'msg'; }

    function setField(id, val, muted) {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'field-value' + (muted ? ' muted' : '') + (!val ? ' empty' : '');
      el.textContent = val || (muted ? '无' : '未识别');
    }

    function doParse() {
      hideMsg();
      const result = parseOrder(document.getElementById('input').value);
      if (!result.ok) { showMsg('error', result.error); return; }

      const d = result.data;
      parsed = d;

      const now = new Date();
      const dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
      const datetimeStr = dateStr + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

      setField('f-name', d.name);
      setField('f-phone', d.phone);
      setField('f-addr', d.addr);
      setField('f-code', d.code);
      setField('f-type', d.productType);
      setField('f-qty', d.qty);
      setField('f-channel', d.channel);
      setField('f-logistics', d.logistics, true);
      setField('f-date', dateStr);
      setField('f-datetime', datetimeStr);

      const allOk = [d.name, d.phone, d.addr, d.code, d.productType, d.qty, d.channel].every(Boolean);
      const badge = document.getElementById('badge');
      badge.style.display = 'inline';
      badge.className = 'badge' + (allOk ? '' : ' warn');
      badge.textContent = allOk ? '识别正常' : '部分字段未识别';

      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('fields').style.display = 'grid';
      document.getElementById('confirmBtn').disabled = false;
    }

    async function doConfirm() {
      if (!parsed) return;
      hideMsg();

      if (!sdk) { showMsg('success', '演示模式：识别成功（在飞书内使用才能写入）'); return; }

      const sel = document.getElementById('tableSelect');
      const tableId = sel.value;
      if (!tableId) { showMsg('error', '请先选择要写入的表'); return; }
      const tableName = sel.options[sel.selectedIndex].text;

      try {
        document.getElementById('confirmBtn').disabled = true;
        document.getElementById('confirmBtn').textContent = '写入中...';

        const table = await sdk.base.getTableById(tableId);

        // 先获取该表所有字段信息，确认字段类型
        const fieldMetaList = await table.getFieldMetaList();
        log('字段列表：' + fieldMetaList.map(f => f.name + '(' + f.type + ')').join('、'));

        // 根据字段类型构建正确的写入格式
        const now = new Date();
        const tsMs = now.getTime(); // 毫秒时间戳

        // 当天零点时间戳（用于"年月日"字段）
        const todayMs = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

        // 字段名 → 字段类型的映射
        const typeMap = {};
        fieldMetaList.forEach(f => { typeMap[f.name] = f.type; });

        // 构建写入对象，根据字段实际类型决定格式
        // 飞书字段类型：1=文本, 2=数字, 3=单选, 4=多选, 5=日期, 7=复选框, 11=人员 ...
        function buildVal(fieldName, strVal) {
          const t = typeMap[fieldName];
          log('字段「' + fieldName + '」类型=' + t + '，值=' + strVal);
          if (t === 2) return Number(strVal) || 0;   // 数字
          if (t === 3) return { text: strVal };        // 单选
          if (t === 4) return [{ text: strVal }];      // 多选
          if (t === 5) return Number(strVal);           // 日期（时间戳）
          // 文本类型(1)及其他
          return tv(strVal);
        }

        const fields = {};

        // 文本字段
        if (typeMap['收货姓名'] !== undefined) fields['收货姓名'] = buildVal('收货姓名', parsed.name);
        if (typeMap['收货电话'] !== undefined) fields['收货电话'] = buildVal('收货电话', parsed.phone);
        if (typeMap['地址']     !== undefined) fields['地址']     = buildVal('地址', parsed.addr);
        if (typeMap['商品编码'] !== undefined) fields['商品编码'] = buildVal('商品编码', parsed.code);
        if (typeMap['商品类型'] !== undefined) fields['商品类型'] = buildVal('商品类型', parsed.productType);
        if (typeMap['申请渠道'] !== undefined) fields['申请渠道'] = buildVal('申请渠道', parsed.channel);
        if (parsed.logistics && typeMap['物流备注'] !== undefined) {
          fields['物流备注'] = buildVal('物流备注', parsed.logistics);
        }

        // 数量字段（DOUBLE）
        if (typeMap['物品数量'] !== undefined) {
          const t = typeMap['物品数量'];
          fields['物品数量'] = t === 2 ? (Number(parsed.qty) || 0) : buildVal('物品数量', parsed.qty);
        }

        // 时间戳字段
        if (typeMap['申请日期（年月日）'] !== undefined) {
          fields['申请日期（年月日）'] = todayMs;
        }
        if (typeMap['申请日期（年月日时分秒）'] !== undefined) {
          fields['申请日期（年月日时分秒）'] = tsMs;
        }

        log('准备写入 fields：' + JSON.stringify(fields));

        const recordId = await table.addRecord(fields);
        log('写入成功！recordId=' + recordId);
        showMsg('success', '✓ 已写入「' + tableName + '」— ' + parsed.name + ' 的订单');
        doReset();

      } catch (err) {
        log('❌ 写入失败：' + err.message);
        if (err.stack) log('Stack: ' + err.stack);
        showMsg('error', '写入失败：' + err.message);
        document.getElementById('confirmBtn').disabled = false;
        document.getElementById('confirmBtn').textContent = '✓ 写入个人表';
      }
    }

    function doReset() {
      document.getElementById('input').value = '';
      document.getElementById('placeholder').style.display = 'block';
      document.getElementById('fields').style.display = 'none';
      document.getElementById('badge').style.display = 'none';
      document.getElementById('confirmBtn').disabled = true;
      document.getElementById('confirmBtn').textContent = '✓ 写入个人表';
      parsed = null;
    }

    document.getElementById('input').addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') doParse();
    });

    initSDK();
  </script>
</body>
</html>
